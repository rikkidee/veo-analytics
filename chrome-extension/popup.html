<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veo Analytics Scraper</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font: 14px/1.4 system-ui, sans-serif;
        color: #171717;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 8px 12px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: #047857;
        background: #047857;
        color: #fff;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin: 12px 0 0;
      }
      #status.error {
        color: #b91c1c;
      }
      #warnings {
        margin: 8px 0 0;
        padding-left: 18px;
        color: #92400e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Veo Analytics</h1>
    <button id="scrape" class="primary">Scrape This Game</button>
    <p id="status" role="status"></p>
    <ul id="warnings" hidden></ul>
    <div id="actions" hidden>
      <button id="send">Send to Veo Analytics</button>
      <button id="copy">Copy JSON</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
